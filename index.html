<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quote-card">
    <p class="eyebrow">A LITTLE INSPIRATION</p>
    <h1>Random Quote Generator</h1>
    <div class="quote-mark" aria-hidden="true">“</div>
    <blockquote id="quote-text" aria-live="polite">The secret of getting ahead is getting started.</blockquote>
    <p id="quote-author" class="author">— Mark Twain</p>
    <button id="new-quote" type="button">New Quote <span aria-hidden="true">↗</span></button>
    <p class="hint">A fresh thought for your day.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
